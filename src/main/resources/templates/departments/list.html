<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Departments - Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">EMS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Employees</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/departments}">Departments</a>
                </li>
            </ul>
            <span class="navbar-text me-3" sec:authentication="name">User</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2>Department List</h2>

    <div class="mb-3">
        <a th:href="@{/departments/showNewDepartmentForm}" class="btn btn-primary">Add Department</a>
    </div>

    <table class="table table-striped table-hover table-bordered w-75">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Department Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="department : ${listDepartments}">
                <td th:text="${department.id}"></td>
                <td th:text="${department.name}"></td>
                <td>
                    <a th:href="@{/departments/showFormForUpdate/{id}(id=${department.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <!-- Consider handling referential integrity errors gracefully if employees exist -->
                    <a th:href="@{/departments/deleteDepartment/{id}(id=${department.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure? This will fail if employees exist in this department.')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>

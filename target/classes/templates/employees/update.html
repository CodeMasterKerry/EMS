<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5 w-50">
    <h2>Update Employee</h2>
    <hr>

    <form th:action="@{/saveEmployee}" th:object="${employee}" method="POST">
        <!-- Hidden field for ID so JPA will update instead of create -->
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Position</label>
            <input type="text" th:field="*{position}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Department</label>
            <select th:field="*{department}" class="form-select" required>
                <option th:each="dept : ${departments}"
                        th:value="${dept.id}"
                        th:text="${dept.name}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Salary</label>
            <input type="number" step="0.01" th:field="*{salary}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Hire Date</label>
            <!-- Using Thymeleaf format to bind correctly to LocalDate -->
            <input type="date" th:field="*{hireDate}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Update Employee</button>
        <a th:href="@{/}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

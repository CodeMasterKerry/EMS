<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Department - EMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5 w-50">
    <h2>Add Department</h2>
    <hr>

    <form th:action="@{/departments/saveDepartment}" th:object="${department}" method="POST">
        <div class="mb-3">
            <label class="form-label">Department Name</label>
            <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. Finance, IT, HR">
        </div>

        <button type="submit" class="btn btn-primary">Save Department</button>
        <a th:href="@{/departments}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
